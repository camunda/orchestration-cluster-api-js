name: Backport

# Opens cherry-pick PRs onto stable branches.
#   - Label a PR `backport stable/<N>` before or after merging; the backport
#     runs when the PR merges (or immediately, via the comment below).
#   - Or comment `/backport` on a merged PR to (re)run it for its labels.
# Conflicting cherry-picks open a draft PR with the conflicts committed.
# See AGENTS.md "Backporting to stable branches" for generator PRs.

on:
  pull_request_target:
    types: [closed, labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  backport:
    name: Create backport PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Vault JWT auth
    # Job-level, not workflow-level: every comment and label event starts this
    # workflow, and a skipped run would otherwise replace (cancel) a queued
    # backport run in the same group. Only runs that pass `if` join the group.
    # If two real backport runs still collide, the survivor reads the PR's
    # current labels, so no target is lost.
    concurrency:
      group: backport-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # pull_request_target runs this workflow from the default branch and never
    # checks out PR code, so it is safe for fork PRs.
    # Never react to the automation app's own comments
    # (camunda-sdk-automation[bot], id 290741040). author_association is only a
    # cheap pre-filter; the first step checks real repository permission.
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        (
          github.event.action == 'closed' ||
          startsWith(github.event.label.name, 'backport ')
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 290741040 &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/backport')
      )
    steps:
      # Merging needs write access, so a merge is trusted (the merger may be a
      # bot, e.g. Renovate). Labelling an already-merged PR (triage can label)
      # and commenting are checked: the sender needs write, maintain or admin.
      - name: Check the sender may trigger backports
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_ID: ${{ github.event.sender.id }}
        run: |
          set -euo pipefail
          if [ "$SENDER_ID" = 290741040 ]; then
            echo "Sender is camunda-sdk-automation[bot]; allowed."
            exit 0
          fi
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" -q .role_name || true)
          case "$role" in
            admin|maintain|write) echo "$SENDER has $role access; allowed." ;;
            *) echo "::error::$SENDER has '${role:-no}' access to this repository; backports need write access."; exit 1 ;;
          esac

      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      # An app token (not GITHUB_TOKEN) so the backport PRs trigger CI.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport PRs
        id: backport
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: camunda-sdk-automation[bot]
          git_committer_email: 290741040+camunda-sdk-automation[bot]@users.noreply.github.com
          # PRs often contain "Merge branch 'main'" commits; don't cherry-pick them.
          merge_commits: skip
          label_pattern: ^backport ([^ ]+)$
          pull_title: ${pull_title} (backport #${pull_number} to ${target_branch})
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            relates to ${issue_refs}
          # Bot authors (e.g. app/claude) can't be assigned; the action logs and continues.
          add_author_as_assignee: true
          copy_labels_pattern: ^(?!backport ).*
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }

      # Collect the backport PRs to regenerate (see the `regenerate` job).
      # Covers backport PRs created by this run and open ones from earlier runs:
      # on a retry the action reuses existing branches/PRs and doesn't report
      # them in created_pull_numbers, but a failed regeneration must be retried.
      # Each target pins the branch head, so the trusted push job refuses to
      # push if the branch moved after it was regenerated.
      - name: List backport PRs to regenerate
        id: targets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CREATED_PRS: ${{ steps.backport.outputs.created_pull_numbers }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Branch names follow the action's default: backport-<PR>-to-<target>.
          # gh pr list returns 30 PRs by default; the app can have more open.
          existing=$(gh pr list --state open --author app/camunda-sdk-automation \
            --limit 1000 --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"backport-$SOURCE_PR-to-\")) | .number")
          read -ra created <<< "$CREATED_PRS"
          read -ra existing <<< "$(echo "$existing" | tr '\n' ' ')"
          targets='[]'
          for pr in $(printf '%s\n' "${created[@]}" "${existing[@]}" | grep -E '^[0-9]+$' | sort -un); do
            t=$(gh pr view "$pr" --json number,headRefName,baseRefName,headRefOid \
              -q '{pr: .number, branch: .headRefName, base: .baseRefName, sha: .headRefOid}')
            targets=$(jq -c --argjson t "$t" '. + [$t]' <<< "$targets")
          done
          echo "Backport PRs to regenerate: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # The action only fails the step on unexpected errors. When a target
      # can't be backported it comments on the source PR and reports
      # was_successful=false, so fail the job to make that visible too.
      - name: Fail if a target could not be backported
        if: ${{ !cancelled() && steps.backport.outputs.was_successful == 'false' }}
        env:
          BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
        run: |
          echo "::error::Backport failed for some targets: $BY_TARGET. See the comment on the source PR."
          exit 1

  # The SDK commits derived files (the bundled and upstream spec, branding
  # metadata, response assertions and src/gen), and PRs are squash-merged,
  # so a backport carries main's copies of all of them. On a stable branch
  # these must come from the branch's own upstream spec (stable/10 builds
  # camunda stable/8.10). Restore them from the target branch, regenerate
  # exactly like ci.yml's "Generation drift" gate, and commit separately.
  # Runs here (not on the backport PR) because PR-triggered workflows are
  # read from the PR branch, which is based on stable/* and lacks this file.
  #
  # Threat model: regeneration executes code from the backport branch
  # (npm ci lifecycle scripts, scripts/run-pipeline.ts), and anyone with write
  # access can push to that branch and then comment /backport. So the work is
  # split in two:
  #   - `regenerate` runs the branch's code with only a read-only GITHUB_TOKEN:
  #     no App token, no id-token (Vault), no persisted git credentials, no
  #     caches. Its only output is a patch artifact, which it fully controls.
  #   - `push` mints the App token but never checks out or executes branch
  #     code: it runs scripts/check-derived-paths.sh from this workflow's own
  #     commit, rejects the patch unless every changed path is a derived path
  #     (fail closed), applies it with git, and pushes only if the branch head
  #     is still the one that was regenerated.
  regenerate:
    name: Regenerate (#${{ matrix.target.pr }})
    needs: backport
    if: ${{ !cancelled() && needs.backport.outputs.targets != '' && needs.backport.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.backport.outputs.targets) }}
    steps:
      # Trusted copy of this workflow's commit, for the restore list only.
      - uses: actions/checkout@v6
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: work
          ref: ${{ matrix.target.sha }}
          fetch-depth: 0
          persist-credentials: false
      # No npm cache: this job runs untrusted code and must not seed shared caches.
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
      - name: Regenerate and write the patch
        working-directory: work
        env:
          BASE: ${{ matrix.target.base }}
        run: |
          set -euo pipefail
          read -ra derived <<< "$(../trusted/scripts/check-derived-paths.sh --list)"
          git restore --source="origin/$BASE" --staged --worktree -- "${derived[@]}"
          npm ci
          npx tsx scripts/run-pipeline.ts --no-test
          # Compare the staged result with HEAD, not the index: the restore
          # staged the target's copies, which regeneration may undo.
          git add -A
          mkdir -p "$RUNNER_TEMP/regen"
          git diff --cached --binary --no-renames HEAD > "$RUNNER_TEMP/regen/regen.patch"
          git diff --cached --stat HEAD
      - uses: actions/upload-artifact@v5
        with:
          name: regen-${{ matrix.target.pr }}
          path: ${{ runner.temp }}/regen/regen.patch
          if-no-files-found: error
          retention-days: 3

  push:
    name: Push regenerated code (#${{ matrix.target.pr }})
    needs: [backport, regenerate]
    # Also runs when some regenerations failed, to report them on their PRs.
    if: ${{ !cancelled() && needs.backport.outputs.targets != '' && needs.backport.outputs.targets != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Vault JWT auth
    concurrency:
      group: backport-push-${{ matrix.target.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.backport.outputs.targets) }}
    steps:
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      # An app token (not GITHUB_TOKEN) so the pushed commit triggers CI.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # This workflow's own commit: the only code this job executes.
      - uses: actions/checkout@v6
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/download-artifact@v5
        id: patch
        continue-on-error: true
        with:
          name: regen-${{ matrix.target.pr }}
          path: ${{ runner.temp }}/regen

      - name: Check, apply and push the patch
        id: apply
        if: ${{ steps.patch.outcome == 'success' }}
        working-directory: trusted
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ matrix.target.pr }}
          BRANCH: ${{ matrix.target.branch }}
          BASE: ${{ matrix.target.base }}
          SHA: ${{ matrix.target.sha }}
          SOURCE_PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/regen/regen.patch"
          check="$PWD/scripts/check-derived-paths.sh"
          # Branch content is only read by git (checkout, apply, commit); none
          # of it is executed. Use a separate worktree so $check stays trusted.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q "$remote" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$SHA" ]; then
            echo "::error::$BRANCH moved after it was regenerated (expected $SHA); comment /backport on #$SOURCE_PR to retry."
            exit 1
          fi
          if [ ! -s "$patch" ]; then
            echo "Generated code already matches #$PR's branch."
            exit 0
          fi
          git worktree add -q --detach "$RUNNER_TEMP/branch" "$SHA"
          cd "$RUNNER_TEMP/branch"
          # git apply refuses paths outside the worktree, in .git or behind a
          # symlink. Nothing runs between applying and checking, and the check
          # sees exactly what would be committed (both sides of any rename).
          git apply --index --binary "$patch"
          git diff --cached --name-only --no-renames -z HEAD | "$check"
          if git diff --cached --quiet HEAD; then
            echo "Generated code already matches #$PR's branch."
            exit 0
          fi
          git -c user.name='camunda-sdk-automation[bot]' \
            -c user.email='290741040+camunda-sdk-automation[bot]@users.noreply.github.com' \
            commit -q -m "chore(gen): regenerate src/gen for backport of #$SOURCE_PR" \
            -m "Restore the spec and other derived files from $BASE and regenerate from its spec bundle."
          # Lease on the regenerated head: never overwrite a concurrent push.
          git push --force-with-lease="refs/heads/$BRANCH:$SHA" "$remote" "HEAD:refs/heads/$BRANCH"
          echo "Committed regenerated output to #$PR."

      - name: Report a failed regeneration on the backport PR
        if: ${{ !cancelled() && (steps.patch.outcome != 'success' || steps.apply.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ matrix.target.pr }}
          BASE: ${{ matrix.target.base }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Could not regenerate the generated code on this backport (see the [Backport run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})), so it may still carry \`main\`'s generated files. Either the cherry-pick left conflicts in hand-written code, the change depends on spec that \`$BASE\` doesn't have (then it can't be backported as-is), the regenerated patch touched non-generated paths, the branch moved meanwhile, or the commit or push failed. See AGENTS.md \"Backporting to stable branches\"." ||
            echo "::error::Could not comment on #$PR either."
          exit 1

