name: Backport

# Opens cherry-pick PRs onto stable branches.
#   - Label a PR `backport stable/<N>` before or after merging; the backport
#     runs when the PR merges (or immediately, via the comment below).
#   - Or comment `/backport` on a merged PR to (re)run it for its labels.
# Conflicting cherry-picks open a draft PR with the conflicts committed.
# See AGENTS.md "Backporting to stable branches" for generator PRs.

on:
  pull_request_target:
    types: [closed, labeled]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: backport-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  backport:
    name: Create backport PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Vault JWT auth
    # pull_request_target runs this workflow from the default branch and never
    # checks out PR code, so it is safe for fork PRs.
    # Comments are only honoured from people with write access, and never from
    # the automation app itself (camunda-sdk-automation[bot], id 290741040).
    if: >
      (
        github.event_name == 'pull_request_target' &&
        github.event.pull_request.merged &&
        (
          github.event.action == 'closed' ||
          startsWith(github.event.label.name, 'backport ')
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.id != 290741040 &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/backport')
      )
    steps:
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      # An app token (not GITHUB_TOKEN) so the backport PRs trigger CI.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create backport PRs
        uses: korthout/backport-action@v4
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: camunda-sdk-automation[bot]
          git_committer_email: 290741040+camunda-sdk-automation[bot]@users.noreply.github.com
          # PRs often contain "Merge branch 'main'" commits; don't cherry-pick them.
          merge_commits: skip
          label_pattern: ^backport ([^ ]+)$
          pull_title: ${pull_title} (backport #${pull_number} to ${target_branch})
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            relates to ${issue_refs}
          # Bot authors (e.g. app/claude) can't be assigned; the action logs and continues.
          add_author_as_assignee: true
          copy_labels_pattern: ^(?!backport ).*
          experimental: >
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
