name: Release

on:
  push:
    branches:
      - main
      - 'stable/**'
  workflow_dispatch:
    inputs:
      api_break_approved:
        description: >-
          Release even though the public API breaks compatibility with the last release on
          this stable branch (for breaks with no PR to label, e.g. from upstream spec drift).
        type: boolean
        default: false

concurrency:
  group: orchestration-cluster-api-js-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write   # required for pushing version bump commit, tags, CHANGELOG
  packages: write   # required for npm publish via semantic-release
  pull-requests: write
  issues: write
  id-token: write # Required for OIDC

jobs:
  generate:
    name: Generate & Test (Node ${{ matrix.node }} ${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24.x]
        stack: [simple]
        include:
          - node: 24.x
            stack: full
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Export stable line config
        run: |
          echo "CAMUNDA_SDK_CURRENT_STABLE_MAJOR=${{ vars['CAMUNDA_SDK_CURRENT_STABLE_MAJOR'] }}" >> $GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install deps
        run: npm ci

      - name: Generate & Build
        run: npm run build

      - name: Unit Tests
        run: npm test

      - name: Start Integration Stack
        uses: camunda/sdk-infra/actions/start-camunda@v1
        with:
          stack: ${{ matrix.stack }}
          docker-dir: docker

      - name: Integration Tests
        run: npm run test:integration

      - name: Snapshot Spec & Metadata
        run: |
          set -e
          SPEC_DIR=external-spec/upstream/zeebe/gateway-protocol/src/main/proto/v2
          # Deterministic hash over the whole spec directory (multi-file refs).
          HASH=$(find "$SPEC_DIR" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)
          SNAP=spec-snapshots/spec-${HASH}.tgz
          mkdir -p spec-snapshots
          if [ ! -f "$SNAP" ]; then
            tar -czf "$SNAP" -C "$SPEC_DIR" .
            echo "Created new spec snapshot: $SNAP"
          else
            echo "Spec snapshot already exists: $SNAP (no overwrite)"
          fi
          echo "spec snapshot: spec-snapshots/spec-${HASH}.tgz"

      - name: Detect generated drift
        id: detect
        run: |
          if git diff --quiet; then echo "changed=false" >> $GITHUB_OUTPUT; else echo "changed=true" >> $GITHUB_OUTPUT; fi

      - name: Smoke GitHub OIDC token exchange for npm publish (before committing drift)
        if: steps.detect.outputs.changed == 'true' && matrix.stack == 'simple'
        shell: bash
        run: |
          set -euo pipefail
          # A read that dies mid-response (curl 56) is the registry having a bad
          # moment, not the credentials being wrong, so it must not fail a release.
          RETRY="--retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 60"
          REG=$(npm -s config get registry||:); REG=${REG%/}; : "${REG:=https://registry.npmjs.org}"
          HOST=${REG#*://}; HOST=${HOST%%/*}
          # shellcheck disable=SC2086  # $RETRY is a deliberately word-split flag list
          ID=$(curl -fsS $RETRY -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${HOST}" | jq -er .value)
          PKG=$(jq -r '.name|@uri' package.json)
          # shellcheck disable=SC2086  # $RETRY is a deliberately word-split flag list
          RESP=$(curl -fsS $RETRY -H "Authorization: Bearer $ID" "$REG/-/npm/v1/oidc/token/exchange/package/$PKG" -d "")
          TOKEN=$(echo "$RESP" | jq -er '.token')
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ]

      - name: Commit generated artifacts (canonical)
        if: steps.detect.outputs.changed == 'true' && matrix.stack == 'simple'
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          # Exclude workflow files from auto-format drift commits
          git restore .github/workflows/release.yml || true
          git add -A
          git commit -m "fix(gen): regenerate artifacts"

      - name: Stop Integration Stack
        if: always()
        uses: camunda/sdk-infra/actions/stop-camunda@v1
        with:
          stack: ${{ matrix.stack }}
          docker-dir: docker
          artifact-name: release-docker-logs-${{ matrix.node }}-${{ matrix.stack }}

    outputs:
      changed: ${{ steps.detect.outputs.changed }}

  merge:
    name: Fast-forward ${{ github.ref_name }} (if drift)
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward ${{ github.ref_name }}
        if: needs.generate.outputs.changed == 'true'
        run: |
          set -e
          # Generation committed directly on the triggering branch by pushing from the action runner; no staging branch
          echo "Drift committed during generate; ${{ github.ref_name }} already updated."

      - name: No drift – skip fast-forward
        if: needs.generate.outputs.changed != 'true'
        run: echo "No generated drift detected; fast-forward skipped."

  # Builds the newest api-break-approved merge's type declarations for the publish job's API
  # gate. Historical code is built here, without publishing credentials, never in publish.
  api-compat-baselines:
    name: Stage approved API baselines
    needs: merge
    if: startsWith(github.ref_name, 'stable/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Build the newest approved merge
        env:
          GH_TOKEN: ${{ github.token }}
          API_COMPAT_BASELINES: ${{ runner.temp }}/api-compat-baselines
        run: |
          set -uo pipefail
          version=$(npm run -s api-compat -- --print-baseline-major "${GITHUB_REF_NAME#stable/}") || exit 2
          [ -z "$version" ] || bash scripts/api-compat-release-gate.sh --prepare "$version"

      - name: Upload approved API baselines
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: api-compat-baselines-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-compat-baselines
          if-no-files-found: ignore
          retention-days: 1

  publish:
    name: Version & Publish (${{ github.ref_name }})
    needs: [merge, api-compat-baselines]
    # api-compat-baselines is skipped on main; publish must still run there.
    if: ${{ !cancelled() && needs.merge.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.api-compat-baselines.result) }}
    runs-on: ubuntu-latest
    steps:
      # The release pushes directly to a ruleset-protected branch. GITHUB_TOKEN can never
      # bypass a ruleset (the GitHub Actions app is not an eligible bypass actor), so the
      # push is made as camunda-sdk-automation, which is registered as one.
      - name: Import secrets
        id: secrets
        uses: hashicorp/vault-action@v4.0.0
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: jwt
          path: ${{ secrets.VAULT_JWT_PATH }}
          role: ${{ secrets.VAULT_JWT_ROLE }}
          jwtGithubAudience: ${{ secrets.VAULT_JWT_AUDIENCE }}
          exportEnv: false
          secrets: |
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_ID | APP_ID ;
            secret/data/products/agentic-experience/github.com/apps/camunda/camunda-sdk-automation GITHUB_APP_PRIVATE_KEY | APP_PRIVATE_KEY ;

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.secrets.outputs.APP_ID }}
          private-key: ${{ steps.secrets.outputs.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch remote refs for semantic-release
        run: |
          set -euo pipefail
          # semantic-release validates that configured release branches exist on the remote.
          # actions/checkout may only fetch the triggering ref, so fetch all heads explicitly.
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          # semantic-release stores channel information in git notes.
          git fetch origin '+refs/notes/*:refs/notes/*' || true

      - name: Export stable line config
        run: |
          echo "CAMUNDA_SDK_CURRENT_STABLE_MAJOR=${{ vars['CAMUNDA_SDK_CURRENT_STABLE_MAJOR'] }}" >> $GITHUB_ENV

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Determine next version (dry-run)
        id: next_version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          node scripts/next-version.mjs > next-version.out 2>&1 || {
            echo 'Semantic-release dry-run failed:'
            cat next-version.out
            exit 1
          }
          echo "semantic-release summary:";
          grep -E '^(release_branch|release_channel|next_version)=' next-version.out || true
          VER=$(grep -E '^next_version=' next-version.out | tail -n 1 | cut -d '=' -f2)
          if [ -z "$VER" ]; then
            echo "No release required"
            echo "publish_needed=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          else
            echo "Next version: $VER"
            echo "publish_needed=true" >> $GITHUB_OUTPUT
            echo "version=$VER" >> $GITHUB_OUTPUT
          fi

      - name: Bump version & regenerate artifacts
        if: steps.next_version.outputs.publish_needed == 'true'
        run: |
          npm version ${{ steps.next_version.outputs.version }} --no-git-tag-version
          # Check the API surface against the committed spec sources FIRST:
          # `npm run build` re-fetches the upstream spec, and generate:local
          # wipes dist/. Finishing with the full build keeps publish artifacts
          # (dist/index.js, dist/index.cjs, ...) complete.
          npm run generate:local
          npm run build:types
          npm run api:check
          npm run build

      - name: Download approved API baselines
        if: steps.next_version.outputs.publish_needed == 'true' && needs.api-compat-baselines.outputs.artifact-id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.api-compat-baselines.outputs.artifact-id }}
          path: ${{ runner.temp }}/api-compat-baselines
          merge-multiple: true

      # Stable branches must not break customer code that compiled against the last release
      # on the branch. This checks the code actually being published, which includes
      # generated code from upstream spec changes that no PR reviewed. Override: the
      # api-break-approved label on a PR merged into this branch since that release (it
      # covers the API up to its merge), or the api_break_approved input of a manual run.
      - name: API compatibility gate (stable branches)
        if: steps.next_version.outputs.publish_needed == 'true' && startsWith(github.ref_name, 'stable/')
        env:
          # Not every stable branch creates the app token (stable/9 releases with
          # GITHUB_TOKEN); the job token can read the PRs a commit came from.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DISPATCH_APPROVED: ${{ github.event_name == 'workflow_dispatch' && inputs.api_break_approved }}
          API_COMPAT_BASELINES: ${{ runner.temp }}/api-compat-baselines
        run: |
          set -uo pipefail
          # The newest published release of this stable major, not the nearest tag: a
          # stable branch is cut from main at an alpha.
          major="${GITHUB_REF_NAME#stable/}"
          version=$(npm run -s api-compat -- --print-baseline-major "$major") || exit 2
          if [ -z "$version" ]; then
            echo "::notice::No ${major}.x release published yet; nothing to compare against."
            exit 0
          fi
          echo "Baseline: v${version}"
          bash scripts/api-compat-release-gate.sh "$version"

      - name: Smoke tests (post-bump)
        if: steps.next_version.outputs.publish_needed == 'true'
        run: npm test -- --run

      - name: Prepare GitHub release assets
        if: steps.next_version.outputs.publish_needed == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VER="${{ steps.next_version.outputs.version }}"
          OUT="release-assets/orchestration-cluster-api-${VER}-sources.tgz"
          # Include the generated SDK sources and version markers as a single asset.
          tar -czf "$OUT" package.json src/runtime/version.ts src/gen dist
          echo "Prepared $OUT"

      - name: Commit version bump & regenerated artifacts
        if: steps.next_version.outputs.publish_needed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -A
          # [skip ci] is required: unlike GITHUB_TOKEN, a GitHub App token re-triggers
          # workflows, so without it this push would start another release run.
          git commit -m "chore(release): v${{ steps.next_version.outputs.version }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Publish (semantic-release)
        if: steps.next_version.outputs.publish_needed == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
        run: NODE_AUTH_TOKEN="" npx semantic-release

      - name: Build Docs
        if: github.ref_name == 'main'
        run: npm run docs:api

      - name: Deploy Docs
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages

      - name: Upload release analysis logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-analysis
          path: |
            next-version.out

    outputs:
      published_version: ${{ steps.next_version.outputs.version }}
      publish_needed: ${{ steps.next_version.outputs.publish_needed }}

  post-release-smoke:
    name: Post-release smoke test
    needs: publish
    if: needs.publish.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Start Camunda
        uses: camunda/sdk-infra/actions/start-camunda@v1
        with:
          docker-dir: docker

      - name: Wait for published version to propagate
        run: |
          set -euo pipefail
          PKG="@camunda8/orchestration-cluster-api"
          VER="${{ needs.publish.outputs.published_version }}"
          if [ -z "${VER}" ]; then
            echo "::error::published_version is empty; refusing to poll the registry for an unspecified version"
            exit 1
          fi
          echo "Waiting for ${PKG}@${VER} to become resolvable on the registry"
          # npm publish returns before the new version is readable from all
          # registry replicas/CDN edges, so a naive install can hit ETARGET.
          # Poll `npm view` until the exact version resolves (or time out).
          attempts=30
          delay=10
          for i in $(seq 1 "$attempts"); do
            # Capture stderr so we can distinguish "not visible yet" from a
            # real registry/network/auth failure instead of masking both.
            if err=$(npm view --prefer-online "${PKG}@${VER}" version 2>&1 >/dev/null); then
              echo "Resolved ${PKG}@${VER} after attempt ${i}"
              exit 0
            fi
            if ! printf '%s' "$err" | grep -qiE 'ETARGET|E404|No matching version|is not in this registry'; then
              echo "::error::Unexpected npm error while checking ${PKG}@${VER}; failing fast:"
              printf '%s\n' "$err"
              exit 1
            fi
            echo "Attempt ${i}/${attempts}: ${VER} not visible yet; retrying in ${delay}s"
            sleep "$delay"
          done
          echo "::error::${PKG}@${VER} did not become resolvable within $((attempts * delay))s"
          exit 1

      - name: Install published SDK into example-app
        working-directory: example-app
        run: |
          VER="${{ needs.publish.outputs.published_version }}"
          echo "Installing @camunda8/orchestration-cluster-api@${VER}"
          npm install "@camunda8/orchestration-cluster-api@${VER}"

      - name: Run example-app
        working-directory: example-app
        run: npx tsx index.ts

      - name: Stop Camunda
        if: always()
        uses: camunda/sdk-infra/actions/stop-camunda@v1
        with:
          docker-dir: docker
          artifact-name: post-release-smoke-docker-logs

  notify-release-failure:
    needs: [generate, merge, api-compat-baselines, publish, post-release-smoke]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1
    with:
      repo-name: orchestration-cluster-api-js
      workflow-name: Release
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
